project: artefacts/arena-composer

version: 0.1.0

# The showcase gallery (docs/development.md#the-showcase) as a job. From the repo root, with
# Arena's venv active and this checkout installed in it, on a machine that can draw:
#
#   artefacts run showcase
#
# Every PNG and tests_junit.xml, a test case per spec, land at the top of the scenario's upload
# dir; the specs the themes generated go in specs/ beside them.
#
# Artefacts ignores exit codes and passes a run that leaves no tests_junit.xml, so when pytest
# cannot write one (no pytest, Arena failing to import) the command writes an error in its place.
# `2>&1` is required: the client reads a command's stdout to the end before its stderr, so a
# command that fills the stderr pipe first blocks forever.
#
# `package` and `simulator` are placeholders the config validator requires: a local run builds
# nothing, and nothing here starts Isaac Sim. `isaac_sim` names the stack Arena comes in, as the
# other Arena projects' jobs do.

jobs:
  showcase:
    type: test
    timeout: 30 # minutes; about 5 once the props are downloaded
    package:
      docker:
        build:
          dockerfile: empty
    runtime:
      framework: other
      simulator: isaac_sim
    scenarios:
      settings:
        - name: showcase
          run: >-
            ARENA_SHOWCASE_DIR="$ARTEFACTS_SCENARIO_UPLOAD_DIR" python -m pytest showcase
            --junitxml="$ARTEFACTS_SCENARIO_UPLOAD_DIR/tests_junit.xml" 2>&1
            || [ -e "$ARTEFACTS_SCENARIO_UPLOAD_DIR/tests_junit.xml" ]
            || echo '<testsuite name="showcase" tests="1" errors="1"><testcase name="pytest"><error
            message="pytest wrote no tests_junit.xml, is the Arena venv active? See test_process_log.txt"/></testcase></testsuite>'
            > "$ARTEFACTS_SCENARIO_UPLOAD_DIR/tests_junit.xml"

  # The Isaac Sim comparison (docs/development.md#the-isaac-sim-comparison), a scenario per spec in
  # parity/specs/. Also needs Isaac Sim in Arena's venv, a GPU RTX renders on, and its EULA accepted,
  # which nothing here does for you:
  #
  #   OMNI_KIT_ACCEPT_EULA=YES artefacts run parity
  #
  # Each scenario's upload gets an Isaac Sim | composer picture per camera, tests_junit.xml with a
  # test case per camera, and metrics.json; a camera fails when it draws further from Isaac Sim than
  # parity/baseline.json says it did. compare.py writes tests_junit.xml however it ends, and the
  # fallback below covers a python that cannot start it.
  parity:
    type: test
    timeout: 30 # minutes; about one once the assets are downloaded
    package:
      docker:
        build:
          dockerfile: empty
    runtime:
      framework: other
      simulator: isaac_sim
    scenarios:
      defaults:
        metrics: target/parity-metrics.json
        run: >-
          python parity/compare.py "$SPEC" --out "$ARTEFACTS_SCENARIO_UPLOAD_DIR" --timeout 20
          --metrics target/parity-metrics.json 2>&1
          || [ -e "$ARTEFACTS_SCENARIO_UPLOAD_DIR/tests_junit.xml" ]
          || echo '<testsuite name="parity" tests="1" errors="1"><testcase name="compare"><error
          message="compare.py wrote no tests_junit.xml, is the Arena venv active? See test_process_log.txt"/></testcase></testsuite>'
          > "$ARTEFACTS_SCENARIO_UPLOAD_DIR/tests_junit.xml"
      settings:
        - name: robolab_props
          params: {SPEC: parity/specs/robolab_props.yaml}
        - name: arena_appliances
          params: {SPEC: parity/specs/arena_appliances.yaml}
        - name: arena_props
          params: {SPEC: parity/specs/arena_props.yaml}
        - name: simready_props
          params: {SPEC: parity/specs/simready_props.yaml}
        - name: lightwheel_kitchen
          params: {SPEC: parity/specs/lightwheel_kitchen.yaml}
        - name: gr1_kitchen
          params: {SPEC: parity/specs/gr1_kitchen.yaml}

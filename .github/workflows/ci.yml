name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PyPI shows the README the wheel carries, with no repository to resolve a
      # relative link against, so each is pointed at GitHub, at this commit.
      - run: python3 docs/site/stage.py --readme
      # The platform tag follows the newest glibc symbol the extension uses, so
      # the wheel is built against manylinux_2_28's glibc, not the runner's.
      # rust-cache cannot reach a build inside that container, so sccache keeps
      # the compiled dependencies in the Actions cache; a pull request reads main's.
      - uses: PyO3/maturin-action@v1
        with:
          manylinux: "2_28"
          sccache: true
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist

  pytest:
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: astral-sh/setup-uv@v6
      # isaaclab_arena is not on PyPI, so the wheel goes in without its
      # dependencies and the rest are named here; tests/conftest.py sets aside
      # the tests that import Arena. Isaac Sim provides pxr in an Arena venv.
      - run: |
          uv venv --python 3.12
          uv pip install --no-deps dist/*.whl
          uv pip install msgpack numpy pillow "mcp>=2" "ruamel.yaml>=0.18" pyyaml pytest usd-core
          .venv/bin/pytest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cargo-test, pytest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      # The wheel is versioned from Cargo.toml, so the tag must name the same version.
      - run: test -f dist/arena_composer-"${GITHUB_REF_NAME#v}"-*.whl
      # The notes are the version's section of CHANGELOG.md, less the link
      # definitions at its foot. No section means `## [Unreleased]` was never
      # renamed for this release, and the release waits until it is.
      - run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" \
            'index($0, "## [") == 1 { if (on) exit; on = index($0, heading) == 1; next } on && !/^\[[^]]*\]: /' \
            CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error file=CHANGELOG.md::no section for ${GITHUB_REF_NAME#v}"; exit 1; }
      # GitHub appends its list of the merged pull requests below the notes.
      - run: gh release create "$GITHUB_REF_NAME" dist/*.whl --repo "$GITHUB_REPOSITORY" --notes-file notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # The same wheel, to PyPI, once someone approves this run's deployment to the
  # `pypi` environment, which deploys `v*` tags only. PyPI trusts this workflow
  # through that environment (trusted publishing), so no token is stored.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/arena-composer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

name: Docs

# The docs site: built on every pull request, where `--strict` fails a link to a page or a heading
# that does not exist, and deployed to GitHub Pages from main. docs/development.md says how it is
# put together.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request's newer push supersedes its build; a deploy runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: python3 docs/site/stage.py
      - run: uvx zensical@0.0.71 build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # What `deploy-pages` needs, on top of Pages' source being set to "GitHub Actions" in the
    # repository settings.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

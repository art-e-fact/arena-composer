[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "arena-composer"
description = "Custom IsaacLab-Arena environments for this project, plus a Bevy viewer for them"
# abi3-py312: the extension module is built against the 3.12 stable ABI.
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "isaaclab_arena",
    "msgpack>=1.1",
    "numpy",
    # The MCP server (arena_composer.mcp_server).
    "mcp>=2",
    # Round-trip YAML: the stock dumper drops comments and key order, and a
    # spec an agent edits has to stay a file a human still wants to read.
    "ruamel.yaml>=0.18",
]

[project.scripts]
arena-resolve-layout = "arena_composer.resolve_layout:main"
arena-view = "arena_composer.view:main"
arena-mcp = "arena_composer.mcp_server:main"

[tool.maturin]
features = ["extension-module"]
module-name = "arena_composer._core"
python-source = "python"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
prerelease = "if-necessary-or-explicit"

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

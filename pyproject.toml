[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "arena-composer"
description = "A live editor, headless renderer and MCP server for IsaacLab-Arena environment specs"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-*"]
# abi3-py312: the extension module is built against the 3.12 stable ABI.
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    # Not on PyPI: installed into the venv Arena already built. Bounded to the
    # minor this was tested against, since some of what it imports is private.
    "isaaclab_arena>=0.3,<0.4",
    "msgpack>=1.1",
    "numpy",
    # The YAML reader Arena validates specs with.
    "pyyaml",
    # The MCP server (arena_composer.mcp_server).
    "mcp>=2",
    # Round-trip YAML: the stock dumper drops comments and key order, and a
    # spec an agent edits has to stay a file a human still wants to read.
    "ruamel.yaml>=0.18",
]

[project.scripts]
arena-resolve-layout = "arena_composer.resolve_layout:main"
arena-view = "arena_composer.view:main"
arena-render = "arena_composer.render:main"
arena-mcp = "arena_composer.mcp_server:main"
arena-composer = "arena_composer.cli:main"

[tool.maturin]
features = ["extension-module"]
module-name = "arena_composer._core"
python-source = "python"
# Bytecode left by a local test run is not part of the package.
exclude = ["**/__pycache__/**"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
prerelease = "if-necessary-or-explicit"

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

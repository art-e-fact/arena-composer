env_name: showcase_tabletop_office
embodiment:
  id: franka
  registry_name: franka_ik
  params: {}
background:
  id: office_table
  registry_name: office_table_background
  params: {}
relations:
- kind: is_anchor
  subject: office_table
  params: {}
- kind: at_position

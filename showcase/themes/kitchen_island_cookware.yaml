# An AgiBot at an industrial L-shaped kitchen's island, set with cookware and dishes.
env_name: showcase_kitchen_island_cookware
embodiment:
  id: agibot
  registry_name: agibot
  params: {}
background:
  id: kitchen
  registry_name: lightwheel_kitchen_l_shaped_with_island_industrial
  params:
    collision_mode: mesh
    repair_collision_mesh_non_watertight: false
object_references:
- {id: floor, parent_id: kitchen, prim_path: floor_room/geometry, object_type: base, params: {}}
- {id: island_top, parent_id: kitchen, prim_path: island_island_group/top_geometry, object_type: base, params: {}}
relations:
- {kind: is_anchor, subject: floor, params: {}}
- {kind: is_anchor, subject: island_top, params: {}}
- {kind: 'on', subject: agibot, reference: floor, params: {}}
- {kind: next_to, subject: agibot, reference: island_top, params: {side: positive_y, distance_m: 0.05, tolerance_m: 0.1}}
- {kind: rotate_around_solution, subject: agibot, params: {yaw_rad: -1.57}}
draw:
  from: [Residential/Kitchen/Cooking_Gear, Residential/Kitchen/Dishware, Residential/Kitchen/Cutting_Boards]
  count: 6
  onto: island_top

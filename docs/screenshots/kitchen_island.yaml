# The scene the README's screenshots show (shoot.sh beside this file). Written to show the visual
# editor off: a kitchen that fills the view from the background's own camera, objects nested on an
# object reference, and relations of several kinds, unary ones among them for the graph's chips.
# The position limits keep the objects inside that camera's frame. Relations are named by position
# in shoot.sh: move one and update it there. The README's video plays in this scene too, and
# docs/video/tour.json names its objects, the next_to between the bowl and the plate, the mug's
# face_to, and the plate's position_limits_box by its x_limits.
env_name: kitchen_island
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
background:
  id: kitchen
  registry_name: lightwheel_kitchen_l_shaped_with_island_industrial
  params:
    # Keeps the objects off the kitchen's own props, the plant on the island among them, which the
    # spec does not name. The default, bbox, cannot: the kitchen's box holds everything.
    collision_mode: mesh
objects:
- id: plate
  registry_name: plate_large_vomp_robolab
  params: {}
- id: apple
  registry_name: apple_01_objaverse_robolab
  params: {}
- id: banana
  registry_name: banana_ycb_robolab
  params: {}
- id: wooden_bowl
  registry_name: wooden_bowl_hot3d_robolab
  params: {}
- id: mug
  registry_name: mug_ycb_robolab
  params: {}
- id: milk
  registry_name: milk_carton_hope_robolab
  params: {}
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
  params: {}
- id: island_top
  parent_id: kitchen
  prim_path: island_island_group/top_geometry
  object_type: base
  params: {}
relations:
- kind: is_anchor
  subject: floor
  params: {}
- kind: is_anchor
  subject: island_top
  params: {}
- kind: 'on'
  subject: droid
  reference: floor
  params: {}
- kind: next_to
  subject: droid
  reference: island_top
  params:
    side: positive_y
    # The robot's stand is placed against the island's side: at the default 1 cm, about half the
    # solver's candidates miss it, and a sample of the five can fail with an object added.
    tolerance_m: 0.05
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: -1.57
- kind: 'on'
  subject: plate
  reference: island_top
  params: {}
- kind: position_limits_box
  subject: plate
  params:
    x_limits: [2.55, 2.75]
    y_limits: [-3.92, -3.62]
- kind: 'on'
  subject: apple
  reference: plate
  params: {}
- kind: 'on'
  subject: banana
  reference: plate
  params: {}
- kind: 'on'
  subject: wooden_bowl
  reference: island_top
  params: {}
- kind: next_to
  subject: wooden_bowl
  reference: plate
  params:
    side: positive_x
    # Room for the video's pear: it adds one to the plate, then sends the bowl round behind it.
    distance_m: 0.15
- kind: 'on'
  subject: mug
  reference: island_top
  params: {}
- kind: face_to
  subject: mug
  reference: wooden_bowl
  params: {}
- kind: 'on'
  subject: milk
  reference: island_top
  params: {}
- kind: position_limits_box
  subject: milk
  params:
    x_limits: [3.3, 3.4]
    y_limits: [-3.42, -3.27]
- kind: position_limits_box
  subject: mug
  params:
    # In front of the bowl, off the line from the plate to it: the mug's face_to and the bowl's
    # next_to then come at the bowl from two sides, rather than as one run of chevrons.
    x_limits: [3.05, 3.15]
    y_limits: [-4.22, -4.12]
- kind: not_next_to
  subject: milk
  reference: plate
  params:
    side: negative_x
task:
  composition: atomic
  description: Pick up the apple from the plate on the kitchen island and put it in the wooden bowl.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: apple
      destination_location: wooden_bowl
      background_scene: kitchen
      destination_object: wooden_bowl

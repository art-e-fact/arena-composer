[package]
name = "arena_composer"
version = "0.7.0"
edition = "2024"
description = "Bevy viewer for dry-resolved IsaacLab-Arena layouts."
authors = ["Andras Polgar <azazdeaz@gmail.com>"]
license = "MIT OR Apache-2.0"

[lib]
name = "arena_composer"
# `cdylib` is what Python imports (the compiled extension module);
# `rlib` is what our own `[[bin]]` and `cargo test` link against.
crate-type = ["cdylib", "rlib"]

# Opens a packed scene straight off disk, in the window or drawn headless, so
# the viewer and the renderer can be iterated on with `cargo run` without
# paying for Arena's import + solve on every rebuild.
[[bin]]
name = "arena-viewer"
path = "src/main.rs"

[dependencies]
# Bevy's defaults less audio and gamepads, which link libasound and libudev: a
# manylinux wheel may link neither. Both arrive with every default collection,
# so the rest of the `3d` and `ui` collections is spelled out here instead.
bevy = { version = "0.20.1", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "wayland",
    "3d_bevy_render",
    # The heads-up line is a `bevy_ui` text node.
    "ui_bevy_render",
    "default_font",
    # `MeshRayCast`, which finds the object under a drop.
    "mesh_picking",
    # USD supports jpg textures.
    "jpeg",
] }
# The editor panel. Immediate mode, so the form is a function of the last spec
# rather than a widget tree to keep in step with one. Pinned: the bevy version
# it integrates with is the version in its number, not in a range. 0.43.1
# fixes its shader in a browser.
bevy_egui = "0.43.1"
# Bevy 0.20 has a pan-orbit camera of its own, but no input for it yet: every
# example copies a few hundred lines of it. It also has no focus to frame, and
# it smooths by the wall clock, which the recorded tour does not run on.
bevy_panorbit_camera = "0.36.0"
# `rc`: a geometry's nodes decode into an `Arc`, which the pipe's reader shares
# with the layout after (`src/wire.rs`).
serde = { version = "1", features = ["derive", "rc"] }
# The payload is MessagePack: maps for the scene, `bin` blobs for the vertex
# arrays. `serde_bytes` keeps those blobs from being decoded element by element,
# and `bytemuck` reinterprets them as vertex arrays in one copy.
rmp-serde = "1"
serde_bytes = "0.11"
bytemuck = "1"
anyhow = "1"
# The demo video's storyboard (`src/tour.rs`).
serde_json = "1"
pyo3 = { version = "0.29", features = ["abi3-py312"], optional = true }

# The web viewer (`web/`, `src/web.rs`). `web` gives Bevy the browser's clock
# and event loop, and WebGL2 draws in every browser, where WebGPU does not yet.
# wasm-bindgen at the version Bevy already pulls in, which the wasm-bindgen CLI
# has to match. Cargo.lock gains the WebGL crates; a native build fetches none.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["web", "webgl2"] }
wasm-bindgen = "0.2.127"

[features]
# Compiles the PyO3 wrapper (src/python.rs). Safe for a normal `cargo build`,
# since it still links against a real libpython.
python = ["dep:pyo3"]
# What maturin builds with: on top of `python`, this tells PyO3 *not* to link
# libpython — the interpreter loading the .so already provides those symbols.
# It breaks `cargo run`/`cargo test`, hence not in the default feature set.
extension-module = ["python", "pyo3/extension-module"]

# Symbol names are ~40% of the unstripped extension the wheel ships.
[profile.release]
strip = true

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
# Without this, projecting a USD stage is unusably slow in a debug build.
[profile.dev.package."*"]
opt-level = 3
